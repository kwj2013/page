名称：Jekyll 站点 CI: Jekyll site CI

在：:
  推送：:
    分支: [ "main" ]: [ "main" ]
  拉取请求：:
    分支: [ "main" ]: [ "main" ]

职位：:
  构建：:

    运行环境：ubuntu-latest: ubuntu-latest

    步骤：:
    - 用法：actions/checkout@v4uses: actions/checkout@v4
    - name: 在 jekyll/builder 容器中构建网站name: Build the site in the jekyll/builder container
      运行：|: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
